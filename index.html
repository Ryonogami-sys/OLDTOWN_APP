<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLDTOWN 仕入れ管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#222}
.app{max-width:480px;margin:auto;padding:22px 16px 50px}
header{text-align:center;padding:18px 0 25px}
header h1{font-size:25px;margin:0;letter-spacing:1px}
header p{font-size:12px;color:#888;margin:8px 0}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #00000008}
.label{font-size:13px;color:#777}
.big{font-size:32px;font-weight:750;margin:10px 0}
.stats{display:flex;justify-content:space-between;gap:10px}
.stat{flex:1;min-width:0;background:#f6f7f9;border-radius:12px;padding:13px;text-align:center}
.stat strong{display:block;font-size:19px;margin-top:6px}
.price-wrap{display:flex;align-items:center;border:2px solid #ddd;border-radius:12px;margin:15px 0;padding:0 16px;background:white}
.price-wrap:focus-within{border-color:#222}
.price-wrap input{width:100%;min-width:0;font-size:30px;padding:17px 0;border:0;text-align:right;outline:none;background:transparent}
.suffix{font-size:30px;font-weight:600;color:#555;white-space:nowrap}
button{border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#222;color:white;width:100%}
.register{background:#2563eb;color:white;width:100%;margin-top:15px}
.secondary{background:#eee;width:100%;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0;font-size:15px}
.delete{background:#fee2e2;color:#b91c1c;padding:7px 11px;font-size:12px}
h2{font-size:17px;margin:0 0 16px}
.group{border:1px solid #eee;border-radius:12px;padding:15px;margin-top:12px}
.group-title{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-weight:bold}
.group-date{font-size:12px;color:#888;margin-top:7px}
.details{margin-top:12px;display:none}
.empty{color:#aaa;text-align:center;padding:20px;font-size:14px}
</style>
</head>
<body>
<div class="app">

<header>
<h1>OLDTOWN</h1>
<p>PURCHASE MANAGER</p>
</header>

<!-- 現在の仕入れを先に表示 -->
<div class="card">
<h2>現在の仕入れ</h2>
<div class="stats">
<div class="stat"><span class="label">枚数</span><strong id="currentCount">0枚</strong></div>
<div class="stat"><span class="label">小計</span><strong id="currentTotal">₩0</strong></div>
</div>

<div class="price-wrap">
<input type="text" id="price" placeholder="金額" inputmode="numeric" autocomplete="off" aria-label="金額（千ウォン単位）">
<span class="suffix">000 ₩</span>
</div>

<button class="primary" onclick="addItem()">＋ 追加</button>
<div id="currentList"></div>
<button class="register" onclick="registerGroup()">✓ この仕入れを登録</button>
</div>

<!-- 総仕入れ金額を下に移動 -->
<div class="card">
<div class="label">総仕入れ金額</div>
<div class="big" id="total">₩0</div>
<div class="stats">
<div class="stat"><span class="label">総枚数</span><strong id="count">0枚</strong></div>
<div class="stat"><span class="label">平均単価</span><strong id="average">₩0</strong></div>
</div>
</div>

<div class="card">
<h2>仕入れ履歴</h2>
<div id="history"></div>
</div>

<button class="primary" onclick="exportCSV()" style="margin-bottom:12px">
📥 CSVダウンロード
</button>
<button class="secondary" onclick="resetAll()">すべてのデータを削除</button>

</div>

<script>
const STORAGE_GROUPS="oldtownGroups";
const STORAGE_CURRENT="oldtownCurrent";

let groups=JSON.parse(localStorage.getItem(STORAGE_GROUPS)||"[]");
let current=JSON.parse(localStorage.getItem(STORAGE_CURRENT)||"[]");

const yen=n=>"₩"+n.toLocaleString("ja-JP");

function save(){
localStorage.setItem(STORAGE_GROUPS,JSON.stringify(groups));
localStorage.setItem(STORAGE_CURRENT,JSON.stringify(current));
}

function addItem(){
const input=document.getElementById("price");
const raw=input.value.trim();

if(!/^\d+$/.test(raw)){
alert("数字を入力してください");
return;
}

const value=Number(raw)*1000;
if(!Number.isSafeInteger(value)||value<=0){
alert("正しい金額を入力してください");
return;
}

current.push(value);
input.value="";
save();
render();
input.focus();
}

function removeItem(index){
current.splice(index,1);
save();
render();
}

function registerGroup(){
if(current.length===0){
alert("金額を入力してください");
return;
}

groups.push({
items:[...current],
date:new Date().toISOString()
});

current=[];
save();
render();
document.getElementById("price").focus();
}

function toggleGroup(index){
const el=document.getElementById("details"+index);
el.style.display=el.style.display==="block"?"none":"block";
}

function exportCSV(){
  if(groups.length===0){
    alert("登録済みの仕入れデータがありません");
    return;
  }

  const rows=[["仕入れ回","登録日時","仕入れ金額（KRW）"]];

  groups.forEach((group,i)=>{
    const items=Array.isArray(group)?group:group.items;
    const date=Array.isArray(group)?"日時不明":formatDate(group.date);

    items.forEach(price=>{
      rows.push([i+1,date,price]);
    });
  });

  const csv="\uFEFF"+rows.map(row=>row.join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);

  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");

  const filename=`OLDTOWN_仕入れ_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.csv`;

  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function resetAll(){
if(!confirm("すべての仕入れデータを削除しますか？"))return;
groups=[];
current=[];
save();
render();
}

function formatDate(dateString){
if(!dateString)return "日時不明";
const d=new Date(dateString);
if(Number.isNaN(d.getTime()))return "日時不明";
return d.toLocaleString("ja-JP",{
year:"numeric",month:"2-digit",day:"2-digit",
hour:"2-digit",minute:"2-digit"
});
}

function getItems(group){
return Array.isArray(group)?group:group.items;
}

function render(){
const currentTotal=current.reduce((a,b)=>a+b,0);
document.getElementById("currentCount").textContent=current.length+"枚";
document.getElementById("currentTotal").textContent=yen(currentTotal);

document.getElementById("currentList").innerHTML=current.map((n,i)=>
`<div class="row"><span>${i+1}. ${yen(n)}</span><button class="delete" onclick="removeItem(${i})">削除</button></div>`
).join("");

const all=groups.flatMap(getItems);
const total=all.reduce((a,b)=>a+b,0);
document.getElementById("total").textContent=yen(total);
document.getElementById("count").textContent=all.length+"枚";
document.getElementById("average").textContent=yen(all.length?Math.round(total/all.length):0);

document.getElementById("history").innerHTML=groups.length?groups.map((group,i)=>{
const items=getItems(group);
const sum=items.reduce((a,b)=>a+b,0);
const date=Array.isArray(group)?"日時不明":formatDate(group.date);

return `<div class="group">
<div class="group-title" onclick="toggleGroup(${i})">
<span>仕入れ ${i+1}回目</span>
<span>${items.length}枚 / ${yen(sum)} ▼</span>
</div>
<div class="group-date">${date}</div>
<div class="details" id="details${i}">
${items.map((n,j)=>`<div class="row">${j+1}. ${yen(n)}</div>`).join("")}
</div>
</div>`;
}).join(""):'<div class="empty">まだ登録がありません</div>';
}

document.getElementById("price").addEventListener("keydown",e=>{
if(e.key==="Enter")addItem();
});

render();
</script>
</body>
</html>
